 pcr_stole_my_husband_opinion:0 "Husband Stealer"

 # Gravidez forçada
 pcr_impregnate_interaction:0 "Impregnate Captive"
 pcr_impregnate_interaction_desc:0 "Force your female captive to bear your child."
 pcr_impregnate_actor_not_fertile_tt:0 "You have no [fertility|E]"
 pcr_impregnate_recipient_not_fertile_tt:0 "[recipient.GetShortUINameNoTooltip|U] has no [fertility|E]"

 pcr_impregnate.0001.t:0 "Forced Union"
 pcr_impregnate.0001.desc:0 "You order your guards to bring the female captive to your chambers. Whether she wills it or not, after tonight, she may carry your blood in her womb."
 pcr_impregnate.0001.desc_pleasure:0 "You have her brought before you once more. This time, she does not struggle. She keeps her head lowered, refusing to meet your gaze, yet when your hand brushes her waist, her breath falters. She bites her lip, as if trying to resist the familiar sensation, but her body trembles beyond her control. She hates herself for this, hates that her body has already memorized you. You lean close and whisper against her ear, and she shuts her eyes — a flush of shame spreads from her neck to the tips of her ears. Whether she denies it or not, after tonight, she may carry your blood once more."
 pcr_impregnate.0001.a:0 "You have no say in this."

 pcr_forced_union_negative_opinion:0 "Forced Union"
 pcr_forced_union_positive_opinion:0 "Unexpected Passion"

 pcr_impregnate_birth_toast:0 "Birth of a Bastard"
 pcr_impregnate_birth_toast_desc:0 "Your female captive has borne you a child. The world does not know you are the father, but this secret will remain in your heart forever."

 # Uniões Livres
 trait_pcr_unbound_unions:0 "Unbound Unions"
 trait_pcr_unbound_unions_desc:0 "This character treats the marriage customs of faith and culture as guidance rather than law. They may have up to ten [spouses|E], regardless of whether their faith or culture normally permits more than one."
 pcr_unbound_unions_spouse_cap_tt:0 "A character with [GetTrait('pcr_unbound_unions').GetName( GetNullCharacter )] must have fewer than ten [spouses|E]"
 pcr_unbound_unions_trait_required_for_secondary_spouse_tt:0 "Without [GetTrait('pcr_unbound_unions').GetName( GetNullCharacter )], a member of this culture may not take a secondary [spouse|E]"
 tradition_pcr_unbound_unions_name:0 "Unbound Union Customs"
 tradition_pcr_unbound_unions_desc:0 "This culture recognizes exceptional households only for those who bear the Unbound Unions trait. They may have up to ten spouses, irrespective of their faith's usual form of marriage; culture members without the trait remain limited to one spouse. Concubines follow the rules of each faith."
 pcr_unbound_unions_tradition_requires_trait_tt:0 "The reforming character must have the [GetTrait('pcr_unbound_unions').GetName( GetNullCharacter )] trait"
 pcr_establish_unbound_unions_decision:0 "Establish Unbound Union Customs"
 pcr_establish_unbound_unions_decision_desc:0 "The marriage finder follows cultural custom more strictly than individual privilege. I can formally establish a custom that lets those with the Unbound Unions trait have up to ten spouses, while denying that privilege to culture members without the trait."
 pcr_establish_unbound_unions_decision_tooltip:0 "Replace this culture's existing marriage tradition, if any, with Unbound Union Customs"
 pcr_establish_unbound_unions_decision_confirm:0 "Establish the Custom"
 pcr_adopt_unbound_unions_decision:0 "Embrace Unbound Unions"
 pcr_adopt_unbound_unions_decision_desc:0 "My culture honors those who bear the Unbound Unions trait. With enough [piety|E], I can claim that privilege for myself."
 pcr_adopt_unbound_unions_decision_tooltip:0 "Gain the [GetTrait('pcr_unbound_unions').GetName( GetNullCharacter )] trait"
 pcr_adopt_unbound_unions_decision_confirm:0 "Embrace It"
