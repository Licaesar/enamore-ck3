 pcr_bed.0001.t:0 "A Night to Remember"
 pcr_bed.0001.desc_give:0 "The door has barely closed before [pcr_bed_partner.GetShortUINameNoTooltip] is in my arms, lips hungry, fingers already tugging at my belt. Silk slides from [pcr_bed_partner.GetHerHis] shoulders and pools on the floor, and the candlelight paints every curve of [pcr_bed_partner.GetHerHis] body in gold.\n\nI lay [pcr_bed_partner.GetHerHim] down and take [pcr_bed_partner.GetHerHim] slowly at first, then with no restraint at all. [pcr_bed_partner.GetSheHe|U] arches beneath me, nails raking my back, and [pcr_bed_partner.GetHerHis] cries grow louder with every thrust until the whole castle must know who [pcr_bed_partner.GetSheHe] belongs to tonight.\n\nWhen I feel the end coming, [pcr_bed_partner.GetSheHe] locks [pcr_bed_partner.GetHerHis] legs around my waist and whispers, breathless, \"Don't you dare stop...\""
 pcr_bed.0001.desc_receive:0 "I do not wait to be undressed. By the time [pcr_bed_partner.GetShortUINameNoTooltip] crosses the room my gown is already on the floor, and the look in [pcr_bed_partner.GetHerHis] eyes is worth every whispered rumour this night will cause.\n\n[pcr_bed_partner.GetSheHe|U] pins me to the sheets and I pull [pcr_bed_partner.GetHerHim] deeper, again and again, until my own screams drown out the creak of the bed. My body trembles, burning, wanting more.\n\nI feel [pcr_bed_partner.GetHerHim] tense, on the very edge, and I hold [pcr_bed_partner.GetHerHim] there with my legs, my lips at [pcr_bed_partner.GetHerHis] ear..."
 pcr_bed.0001.desc_male:0 "There is nothing gentle in the way [pcr_bed_partner.GetShortUINameNoTooltip] pushes me against the bedpost, nor in the way I answer. Clothes tear, breath turns ragged, and two bodies hardened by the world grapple for control until neither of us cares who wins.\n\nSweat, grunts and the slap of skin fill the chamber long into the night. When it is over we lie tangled and spent, and [pcr_bed_partner.GetShortUINameNoTooltip] only laughs, low and satisfied, already reaching for me again."
 pcr_bed.0001.desc_female:0 "[pcr_bed_partner.GetShortUINameNoTooltip] unlaces my gown with maddening patience, kissing every inch of skin as it is revealed. By the time I return the favour we are both trembling.\n\nWe take our time. Soft mouths, wandering fingers, hair spilling across the pillows, and sighs that slowly turn into cries. Again and again we bring each other to the edge, and over it, until the candles gutter out and the dawn finds us still wrapped together, flushed and smiling."
 pcr_bed.0001.a_give:0 "Spill everything inside [pcr_bed_partner.GetShortUINameNoTooltip]"
 pcr_bed.0001.a_receive:0 "Let [pcr_bed_partner.GetShortUINameNoTooltip] fill me completely"
 pcr_bed.0001.twins_give:0 "Take [pcr_bed_partner.GetHerHim] again and again, until [pcr_bed_partner.GetSheHe] carries twins"
 pcr_bed.0001.twins_receive:0 "Keep [pcr_bed_partner.GetHerHim] inside me all night, until I carry twins"
 pcr_bed.0001.b_give:0 "Pull out at the last moment"
 pcr_bed.0001.b_receive:0 "Push [pcr_bed_partner.GetShortUINameNoTooltip] out at the last moment"
 pcr_bed.0001.c_male:0 "Pin [pcr_bed_partner.GetShortUINameNoTooltip] down for one last round"
 pcr_bed.0001.c_female:0 "Bite [pcr_bed_partner.GetShortUINameNoTooltip]'s lip and pull [pcr_bed_partner.GetHerHim] close once more"
 pcr_bed.0001.no_conception_tt:0 "No child can be conceived tonight: [pcr_bed_mother.GetShortUINameNoTooltip] is already pregnant or cannot bear children."

 pcr_bed.0002.t:0 "Seed of the Bloodline"
 pcr_bed.0002.desc:0 "In the warm stillness afterwards, [pcr_bed_partner.GetShortUINameNoTooltip] lies against me, skin still damp, a hand resting low on [pcr_bed_mother.GetShortUINameNoTooltip]'s belly. We both feel it: tonight something took root.\n\nOld midwives swear that what a couple wishes for in this hour, the womb remembers. So what will we ask for?"
 pcr_bed.0002.desc_twins:0 "Exhausted, flushed and tangled in the sheets, we can barely move. Again and again through the night we came together, and now a strange certainty settles over us: [pcr_bed_mother.GetShortUINameNoTooltip] will carry not one child, but two.\n\nOld midwives swear that what a couple wishes for in this hour, the womb remembers. So what will we ask for?"
 pcr_bed.0002.a:0 "A son, strong and fierce"
 pcr_bed.0002.a_twins:0 "Two sons, to carry our name"
 pcr_bed.0002.b:0 "A daughter, beautiful and clever"
 pcr_bed.0002.b_twins:0 "Two daughters, to charm every court"
 pcr_bed.0002.c:0 "Let fate decide"
 pcr_bed.0002.a_tt:0 "The pregnancy will bring #P sons#!"
 pcr_bed.0002.b_tt:0 "The pregnancy will bring #P daughters#!"

 pcr_bed_opinion:0 "Lay with Me"
 pcr_lover_bed:0 "Shared a bed"
 pcr_lover_incest:0 "In Forbidden Love"
 pcr_soulmate_bed:0 "Shared many nights"
