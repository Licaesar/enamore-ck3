l_simp_chinese:
 trait_mwt_unbound_unions:0 "无拘婚盟"
 trait_mwt_unbound_unions_desc:0 "该角色将信仰与文化的婚姻习俗视作参考，而非不可违背的戒律。无论其信仰或文化通常是否准许，该角色都可以拥有至多两名[spouses|E]和三名[concubines|E]。"
 mwt_unbound_unions_spouse_cap_tt:0 "拥有[GetTrait('mwt_unbound_unions').GetName( GetNullCharacter )]的角色，其[spouses|E]必须少于两名"
 mwt_unbound_unions_concubine_cap_tt:0 "拥有[GetTrait('mwt_unbound_unions').GetName( GetNullCharacter )]的角色，其[concubines|E]必须少于三名"
 mwt_unbound_unions_trait_required_for_secondary_spouse_tt:0 "该文化的角色若没有[GetTrait('mwt_unbound_unions').GetName( GetNullCharacter )]，便不能迎娶次级[spouse|E]"
 tradition_mwt_unbound_unions_name:0 "无拘婚俗"
 tradition_mwt_unbound_unions_desc:0 "该文化仅承认拥有“无拘婚盟”特质的统治者采用特殊婚姻制度。无论信仰通常采用何种婚姻形式，这些统治者都可以拥有至多两名配偶和三名侧室；没有该特质的同文化角色仍只能拥有一名配偶，且不能凭借本传统纳侧室。"
 mwt_unbound_unions_tradition_requires_trait_tt:0 "推动改革的角色必须拥有[GetTrait('mwt_unbound_unions').GetName( GetNullCharacter )]特质"
 mwt_establish_unbound_unions_tradition_decision:0 "确立无拘婚俗"
 mwt_establish_unbound_unions_tradition_decision_desc:0 "寻找配偶界面会优先遵循文化习俗，而非人物的单独特权。我可以正式确立一种婚俗：拥有“无拘婚盟”特质的统治者可以拥有两名配偶与三名侧室，而没有该特质的文化成员不能享受这项特权。"
 mwt_establish_unbound_unions_tradition_decision_tooltip:0 "以“无拘婚俗”替换该文化现有的婚姻传统（如有）"
 mwt_establish_unbound_unions_tradition_decision_confirm:0 "确立婚俗"
